name: Babylon containers

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read

# A new default-branch commit cancels the previous unstable run, including
# build/publish/cleanup. PRs are isolated by ref; releases have their own groups.
concurrency:
  group: babylon-containers-v2-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A release of a commit that already has an unstable image (normally the
  # latest default-branch commit) reuses that image instead of rebuilding it.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - name: Wait for the unstable build of the released commit
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The push run of the same commit may still be building its unstable
          # image; wait for it so the release can reuse it (up to an hour).
          for _ in $(seq 1 120); do
            pending=$(gh run list -R "$GITHUB_REPOSITORY" --workflow babylon-containers.yml \
              --event push --commit "$GITHUB_SHA" --limit 20 --json status \
              --jq '[.[] | select(.status != "completed")] | length')
            [ "$pending" = 0 ] && exit 0
            echo "Waiting for $pending unstable run(s) of $GITHUB_SHA"
            sleep 30
          done
          echo '::warning::Unstable run still pending; continuing without waiting'
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for an unstable image of the released commit
        id: reuse
        run: |
          reuse=false
          if [ "$GITHUB_EVENT_NAME" = release ] &&
             docker buildx imagetools inspect "${IMAGE,,}:unstable-$GITHUB_SHA" >/dev/null 2>&1; then
            reuse=true
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "Reuse unstable-$GITHUB_SHA: $reuse" >> "$GITHUB_STEP_SUMMARY"

  compile:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile game, lobby and test builds; run regression tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: check
          # Independent Ubuntu mirror: Canonical DNS outage (runner-images#15296).
          build-args: UBUNTU_MIRROR=http://mirrors.edge.kernel.org/ubuntu
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=babylon-build
          cache-to: type=gha,mode=max,scope=babylon-build

  publish:
    needs: [plan, compile]
    if: needs.plan.outputs.reuse != 'true' && (github.event_name == 'release' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    # Tag moves (unstable, latest, releases) never interleave between runs.
    concurrency:
      group: babylon-image-tags-v2
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Choose image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
        run: |
          image="${IMAGE,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = release ]; then
            [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo 'Release tag is not a valid container tag'; exit 1; }
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            printf 'tags<<TAGS\n%s:latest\n%s:%s\nTAGS\n' "$image" "$image" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=unstable-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            # Publish the cleanup marker before moving the public unstable tag.
            printf 'tags<<TAGS\n%s:unstable-%s\n%s:unstable\nTAGS\n' "$image" "$GITHUB_SHA" "$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # Independent Ubuntu mirror: Canonical DNS outage (runner-images#15296).
          build-args: UBUNTU_MIRROR=http://mirrors.edge.kernel.org/ubuntu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # Keep one manifest per image, without orphan attestation manifests.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=babylon-build
          cache-to: type=gha,mode=max,scope=babylon-build
      - name: Delete superseded unstable images
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          CURRENT_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const cleanup = require('./container/cleanup-unstable.cjs');
            await cleanup({github, context, core, currentDigest: process.env.CURRENT_DIGEST});

  # Same image as the commit's unstable build: only add latest and the release
  # tag. Cleanup never deletes a version carrying either of them. The image's
  # version label keeps saying unstable-<commit>.
  retag:
    needs: plan
    if: needs.plan.outputs.reuse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: babylon-image-tags-v2
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the unstable image as the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo 'Release tag is not a valid container tag'; exit 1; }
          image="${IMAGE,,}"
          docker buildx imagetools create -t "$image:latest" -t "$image:$RELEASE_TAG" "$image:unstable-$GITHUB_SHA"
          echo "Retagged $image:unstable-$GITHUB_SHA as latest and $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Optional: trigger a Komodo procedure (e.g. a redeploy) after a release.
  # Set the action secrets KOMODO_WEBHOOK_URL (the procedure's GitLab listener
  # URL, ending in /<default branch>) and KOMODO_WEBHOOK_SECRET; without them
  # this job does nothing. Both are secrets so the Komodo address stays private.
  notify-komodo:
    needs: [publish, retag]
    if: always() && github.event_name == 'release' && (needs.publish.result == 'success' || needs.retag.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger the Komodo webhook
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          BRANCH: ${{ github.event.repository.default_branch }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.event.repository.clone_url }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo 'Komodo webhook secrets not set; skipping.'
            exit 0
          fi
          # Komodo's GitLab listener only runs when the ref matches the branch
          # at the end of the URL, so send the default branch, not the tag.
          payload=$(jq -n --arg ref "refs/heads/$BRANCH" --arg after "$GITHUB_SHA" \
            --arg name "$REPO_NAME" --arg url "$REPO_URL" \
            '{object_kind: "push", ref: $ref, before: "0000000000000000000000000000000000000000",
              after: $after, repository: {name: $name, url: $url}}')
          curl -fsS -X POST "$KOMODO_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: $KOMODO_WEBHOOK_SECRET" \
            -H "X-Gitlab-Event: Push Hook" \
            -d "$payload" -o /dev/null
          echo 'Komodo webhook triggered.'
