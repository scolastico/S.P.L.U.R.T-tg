services:
  babylon:
    image: ghcr.io/scolastico/babylon13:${BABYLON_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: ${BABYLON_STOP_GRACE_PERIOD:-10m}
    ports:
      - "${BABYLON_LOBBY_PORT:-1361}:${BABYLON_LOBBY_PORT:-1361}/tcp"
      - "${BABYLON_WORLD_PORT_FIRST:-1400}-${BABYLON_WORLD_PORT_LAST:-1420}:${BABYLON_WORLD_PORT_FIRST:-1400}-${BABYLON_WORLD_PORT_LAST:-1420}/tcp"
    environment:
      BABYLON_PUBLIC_HOST: ${BABYLON_PUBLIC_HOST:-127.0.0.1}
      BABYLON_SERVER_NAME: ${BABYLON_SERVER_NAME:-Babylon13}
      BABYLON_ADMINS: ${BABYLON_ADMINS:-}
      BABYLON_LOBBY_PORT: ${BABYLON_LOBBY_PORT:-1361}
      BABYLON_API_PORT: ${BABYLON_API_PORT:-1360}
      BABYLON_WORLD_PORT_FIRST: ${BABYLON_WORLD_PORT_FIRST:-1400}
      BABYLON_WORLD_PORT_LAST: ${BABYLON_WORLD_PORT_LAST:-1420}
      BABYLON_MAX_RUNNING_WORLDS: ${BABYLON_MAX_RUNNING_WORLDS:-4}
      BABYLON_MAX_PLAYERS_PER_WORLD: ${BABYLON_MAX_PLAYERS_PER_WORLD:-4}
      BABYLON_MAX_WORLDS_PER_PLAYER: ${BABYLON_MAX_WORLDS_PER_PLAYER:-3}
      BABYLON_MAX_RUNNING_WORLDS_PER_PLAYER: ${BABYLON_MAX_RUNNING_WORLDS_PER_PLAYER:-1}
      BABYLON_KEPT_SAVE_POINTS_PER_WORLD: ${BABYLON_KEPT_SAVE_POINTS_PER_WORLD:-4}
      BABYLON_DELETE_UNUSED_WORLDS_AFTER_DAYS: ${BABYLON_DELETE_UNUSED_WORLDS_AFTER_DAYS:-60}
      BABYLON_EMPTY_GRACE_SECONDS: ${BABYLON_EMPTY_GRACE_SECONDS:-120}
      BABYLON_STARTUP_TIMEOUT_SECONDS: ${BABYLON_STARTUP_TIMEOUT_SECONDS:-300}
      BABYLON_TICKET_LIFETIME_SECONDS: ${BABYLON_TICKET_LIFETIME_SECONDS:-60}
      BABYLON_SHUTDOWN_TIMEOUT_SECONDS: ${BABYLON_SHUTDOWN_TIMEOUT_SECONDS:-180}
    volumes:
      - babylon-data:/data

volumes:
  babylon-data:
